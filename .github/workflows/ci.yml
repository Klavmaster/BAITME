name: BaitMe checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Pricing and status-machine tests
        run: npm test
      - name: Validate server syntax
        run: |
          node --check services/api/src/server.mjs
          node --check services/api/src/db.mjs
      - name: Typecheck all frontends
        run: npm run typecheck
      - name: Build web dashboard
        run: npm run build:business
