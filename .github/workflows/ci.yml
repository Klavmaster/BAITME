name: BaitMe checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Pricing and status-machine tests
        run: npm test
      - name: Validate server syntax
        run: |
          node --check services/api/src/server.mjs
          node --check services/api/src/db.mjs
      - name: Typecheck all frontends
        run: npm run typecheck
      - name: Build web dashboard
        run: npm run build:business

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baitme_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baitme_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: baitme_ci
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Create simulated Supabase roles for CI
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ci-bootstrap.sql
      - name: Run first schema migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610180001_baitme_init.sql
      - name: Run security migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610180002_security_lockdown.sql
      - name: Run applications and admin migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610180003_applications.sql
      - name: Run complaints and location migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610180004_complaints_tracking.sql
      - name: End-to-end domain/authorization/ledger assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/order-lifecycle.sql
