name: BaitMe checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  customer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Pricing rules
        run: npm test
      - name: Typecheck customer app
        run: npm run typecheck
